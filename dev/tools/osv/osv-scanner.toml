[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-02-09
reason = "golang.org/x/crypto: the advisory covers the deprecated openpgp package in every version; no tagged release fixes it. The osv-scanner binary does not link golang.org/x/crypto/openpgp (checked with go list -deps on 2026-11-09)."
