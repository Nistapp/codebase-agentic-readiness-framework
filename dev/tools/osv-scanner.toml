#
# Known vulnerabilities that `make security` (osv-scanner) accepts for now, for the lockfiles in this folder
# (uv.lock, package-lock.json). Every other one fails the gate. osv-scanner and OpenSSF Scorecard both read the
# osv-scanner.toml next to a lockfile, so each Go tool module has its own (dev/tools/<tool>/osv-scanner.toml).
# Each entry needs an `id`, an `ignoreUntil` date at most six months ahead and a `reason` that says why the
# vulnerability cannot reach this repository or why no fix exists yet. dev/tests/test_tool_pins.py checks this.
# When `ignoreUntil` passes, the scan fails again: fix it or renew the entry with a new reason.
# How to read the scan: docs/reference/dev-tooling.md, "Dependency audit".

[[IgnoredVulns]]
id = "GHSA-gg6h-894w-4m9c"
ignoreUntil = 2027-02-09
reason = "re2js 2.8.6: quadratic-time lookbehind matching. markdownlint 0.42.0 pins it exactly, and markdownlint-cli2 0.24.0 is the newest release. It only lints this repository's own Markdown, which a maintainer reviews in each pull request."

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2027-02-09
reason = "katex 0.16.47: prototype pollution bypasses trust restrictions when KaTeX renders. Reached only through markdownlint 0.42.0 (micromark-extension-math), which parses Markdown and renders no HTML. No markdownlint release raises it yet."
