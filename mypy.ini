# Mypy settings for the `typecheck` verb. The scope (which paths) is set in the Makefile.
[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
# The tools are scripts, not packages, and import each other by module name across folders: the implement tools and
# the dev checks import the shared helpers in audit/tools, and the tests import their folder's path helper.
mypy_path = audit/tools:audit/tools/tests:implement/tools:implement/tools/tests:implement/playbooks/templates:dev:dev/eval:dev/tests
