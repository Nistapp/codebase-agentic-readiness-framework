#
# CI runs the same verbs a human or agent runs locally (see the Makefile): `make check` and `make security`.
# Python 3.11 is the supported minimum and 3.14 the newest release (Q8); Windows is supported through WSL only.
name: CI

on:
  pull_request:
  push:
    branches: [main, brownfield-recipe]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
      - run: make check

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
      - run: make security

  # One required check that stands for the whole matrix, so adding or renaming a `check` leg (a Python
  # version, an OS) never also requires a branch-protection edit.
  ci-gate:
    name: CI Gate
    needs: [check, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require check and security to have succeeded
        run: |
          check="${{ needs.check.result }}"
          security="${{ needs.security.result }}"
          echo "check: $check"
          echo "security: $security"
          if [[ "$check" != "success" ]]; then
            echo "::error::check did not pass"
            exit 1
          fi
          if [[ "$security" != "success" ]]; then
            echo "::error::security did not pass"
            exit 1
          fi
          echo "CI Gate passed."
