#
# CI runs the same verbs a human or agent runs locally (see the Makefile): `make check` and `make security`.
# `make security` needs the network: its dependency audit (osv-scanner) queries osv.dev.
# Python 3.11 is the supported minimum and 3.14 the newest release (Q8); Windows is supported through WSL only.
# The `docs` job runs `make docs-lint` and the Mermaid check when a Markdown file changed; it needs Node, so it
# stays out of `make check` and the matrix. It also annotates the prose of the changed files, which never fails.
# It runs on every pull request and on every push to the two protected branches, `dev` and `main`
# (docs/reference/branch-protection.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: dev/tools/pyproject.toml
      # Go builds actionlint (`make workflow-lint`) from dev/tools/actionlint/go.mod, through the Go module proxy.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev/tools/actionlint/go.mod
          cache-dependency-path: dev/tools/actionlint/go.sum
      - run: make check

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The minimum Python the repository pins (.python-version); the `check` matrix above spans 3.11 and 3.14.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: dev/tools/pyproject.toml
      # Go builds osv-scanner, the dependency audit in `make security`, from dev/tools/osv/go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev/tools/osv/go.mod
          cache-dependency-path: dev/tools/osv/go.sum
      - run: make security

  # The engine's and the recipe tools' suites under coverage.py; fails below the floor in .coveragerc.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: dev/tools/pyproject.toml
      - run: make coverage
        env:
          CI: "true"

  # The engine on this repository against the committed ratchet (.audit-baseline.json): exit 2 when a finding appears
  # that the baseline did not have. Read-only; the report stays under dist/self-audit/. Linux only.
  self-audit:
    name: self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: make self-audit

  # Markdown lint (the DOCS_LINT_PATHS ratchet) and a real-parser render of every Mermaid block in the changed
  # Markdown. The job always runs and is a no-op when no Markdown changed, so CI Gate never sees it skipped.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List changed Markdown
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          list="$RUNNER_TEMP/changed-md.txt"
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=d "$BASE" "$HEAD_SHA" -- '*.md' > "$list"
          else
            git ls-files '*.md' > "$list"
          fi
          echo "Changed Markdown:"
          cat "$list"
          if [[ -s "$list" ]]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
      # The prose check (docs/COMMUNICATION_RULES.md) is advisory: it annotates the changed Markdown with warnings and
      # notices and always exits 0. Fixtures and test data are skipped, as in `make docs-prose`.
      - if: steps.changed.outputs.any == 'true'
        name: Annotate prose in changed Markdown
        run: |
          { grep -v -E '(^|/)(fixtures|testdata)/' "$RUNNER_TEMP/changed-md.txt" || true; } \
            | xargs -r -d '\n' python3 dev/prose_check.py --format github
      - if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.changed.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/puppeteer
            ~/.npm
          key: docs-${{ runner.os }}-${{ hashFiles('dev/tools/package.json') }}
      - if: steps.changed.outputs.any == 'true'
        run: make docs-lint
      - if: steps.changed.outputs.any == 'true'
        name: Validate Mermaid blocks in changed Markdown
        run: xargs -d '\n' -a "$RUNNER_TEMP/changed-md.txt" python3 dev/mermaid_check.py --no-sandbox

  # Every commit subject that the pull request (or the push) adds must follow Conventional Commits. The rule is in
  # dev/commit_lint.py, which the lefthook commit-msg hook also runs. Merge commits are skipped.
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with (a new branch); nothing to check."
            exit 0
          fi
          python3 dev/commit_lint.py --range "$BASE..$HEAD_SHA"

  # One required check that stands for the whole matrix, so adding or renaming a `check` leg (a Python
  # version, an OS) never also requires a branch-protection edit.
  ci-gate:
    name: CI Gate
    needs: [check, security, coverage, self-audit, docs, commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require check, security, coverage, self-audit, docs and commits to have succeeded
        # The results come in through env, never expanded into the script (zizmor: template-injection).
        env:
          check: ${{ needs.check.result }}
          security: ${{ needs.security.result }}
          coverage: ${{ needs.coverage.result }}
          self_audit: ${{ needs.self-audit.result }}
          docs: ${{ needs.docs.result }}
          commits: ${{ needs.commits.result }}
        run: |
          echo "check: $check"
          echo "security: $security"
          echo "coverage: $coverage"
          echo "self-audit: $self_audit"
          echo "docs: $docs"
          echo "commits: $commits"
          if [[ "$check" != "success" ]]; then
            echo "::error::check did not pass"
            exit 1
          fi
          if [[ "$security" != "success" ]]; then
            echo "::error::security did not pass"
            exit 1
          fi
          if [[ "$coverage" != "success" ]]; then
            echo "::error::coverage did not pass"
            exit 1
          fi
          if [[ "$self_audit" != "success" ]]; then
            echo "::error::self-audit did not pass"
            exit 1
          fi
          if [[ "$docs" != "success" ]]; then
            echo "::error::docs did not pass"
            exit 1
          fi
          if [[ "$commits" != "success" ]]; then
            echo "::error::commits did not pass"
            exit 1
          fi
          echo "CI Gate passed."
