#
# OpenSSF Scorecard: scores this repository's security practices (branch protection, pinned actions, token
# permissions, signed releases, ...) and uploads the result to the Security tab as code-scanning alerts. Advisory:
# no ruleset requires it (docs/reference/branch-protection.md, "Code scanning").
# `publish_results: false`: nothing is sent to the public OpenSSF API, so there is no public score page or badge.
# Turning it on is the maintainer's decision; it also needs `id-token: write` on the job.
# Scorecard runs on the default branch only (`dev`).
name: Scorecard

on:
  push:
    branches: [dev]
  schedule:
    - cron: "29 4 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code and read the repository's settings through the API
      security-events: write # upload the result to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
