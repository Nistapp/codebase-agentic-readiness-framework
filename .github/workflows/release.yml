#
# Publishes a GitHub release when the maintainer pushes a tag `v*`: the single-file engine (audit.pyz), the
# agentic-readiness-audit and agentic-readiness-implement skill bundles as zips, and their SHA-256 sums. Runs the
# same gates as CI first. No secret beyond GITHUB_TOKEN; `contents: write` is the only permission. Actions are pinned by commit SHA. A session of an AI
# agent never triggers this workflow. How to cut a release: RELEASE_PROCESS.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
      - name: Gates
        run: |
          make check
          make security
      - name: Build the engine
        run: python3 brownfield-recipes/deterministic-audit/tools/build.py
      - name: Build and validate the skill bundle
        run: make validate-skills
      - name: Collect the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp brownfield-recipes/deterministic-audit/dist/audit.pyz "$out/audit.pyz"
          (cd brownfield-recipes/dist/skills && zip -qr "$out/agentic-readiness-audit-$TAG.zip" agentic-readiness-audit)
          (cd brownfield-recipes/dist/skills && zip -qr "$out/agentic-readiness-implement-$TAG.zip" agentic-readiness-implement)
          (cd "$out" && sha256sum audit.pyz "agentic-readiness-audit-$TAG.zip" "agentic-readiness-implement-$TAG.zip" > SHA256SUMS)
          cat "$out/SHA256SUMS"
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "See CHANGELOG.md. Verify a download with: sha256sum -c SHA256SUMS"
