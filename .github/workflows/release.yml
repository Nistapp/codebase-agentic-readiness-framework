#
# Builds the release files for a tag `vX.Y.Z` on `main` and attaches them to its GitHub release: the single-file
# engine (audit.pyz), the agentic-readiness-audit and agentic-readiness-implement skill bundles as zips, and their
# SHA-256 sums. Runs the same gates as CI first. Then it signs build provenance for the three files (actions/attest,
# public Sigstore) and attaches the signed bundle, so a user can check that a file came from this workflow and tag:
# `gh attestation verify <file> --repo <owner/repo> --source-ref refs/tags/<tag> --bundle <tag>.sigstore.json`.
#
# release-please.yml starts this workflow (workflow_dispatch, from the tag: `--ref vX.Y.Z`) after release-please has
# made the tag and the release. The run must start from the tag it builds, because the provenance records the run's
# ref and commit, not the checkout. A
# tag pushed by the default GITHUB_TOKEN starts no workflow, so this workflow has no `push: tags` trigger. The
# maintainer can also start it by hand for an existing tag; then it creates the release when there is none. No secret
# beyond GITHUB_TOKEN. The job's permissions are `contents: write` (the release) and, for the provenance,
# `id-token: write`, `attestations: write` and `artifact-metadata: write`. Actions are pinned by commit SHA. A session of an AI
# agent never triggers this workflow. How releases work: RELEASE_PROCESS.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, vX.Y.Z (it must exist and be on main)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
      id-token: write # mint the OIDC token that Sigstore signs the provenance with
      attestations: write # store the provenance in the repository's attestations
      artifact-metadata: write # record the release files as attested artifacts
    steps:
      - name: Require a tag of the form vX.Y.Z
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vX.Y.Z."
            exit 1
          fi
      # The provenance names the ref the run started from. Started from main or a branch, it would name a commit
      # that may not be the tagged one.
      - name: Require the run to start from the tag
        env:
          TAG: ${{ inputs.tag }}
          RUN_REF: ${{ github.ref }}
        run: |
          if [[ "$RUN_REF" != "refs/tags/$TAG" ]]; then
            echo "::error::This run started from $RUN_REF. Start it from the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      # A release is a tag on `main`, and `main` holds only what was promoted from `dev` or merged from the release
      # pull request (RELEASE_PROCESS.md). A tag on any other commit publishes nothing.
      - name: Require the tagged commit to be on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag $TAG points at $sha, which is not on main."
            exit 1
          fi
          echo "Tag $TAG ($sha) is on main."
      - name: Require the engine version to match the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -c 'import re,sys; print(re.search(r"^__version__ = \"([^\"]+)\"", open("audit/engine/audit/__init__.py").read(), re.M).group(1))')"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::The engine says $version, but the tag is $TAG. release-please bumps both together; see RELEASE_PROCESS.md."
            exit 1
          fi
          echo "Engine version $version matches $TAG."
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: dev/tools/pyproject.toml
      # Go builds osv-scanner for the dependency audit in `make security`. No cache in a release job: a cache
      # written by another workflow must not reach the release files.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev/tools/osv/go.mod
          cache: false
      - name: Gates
        run: |
          make check
          make security
      - name: Build the engine
        run: python3 audit/engine/build.py
      - name: Build and validate the skill bundle
        run: make validate-skills
      - name: Collect the release files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp audit/engine/dist/audit.pyz "$out/audit.pyz"
          (cd dev/dist/skills && zip -qr "$out/agentic-readiness-audit-$TAG.zip" agentic-readiness-audit)
          (cd dev/dist/skills && zip -qr "$out/agentic-readiness-implement-$TAG.zip" agentic-readiness-implement)
          (cd "$out" && sha256sum audit.pyz "agentic-readiness-audit-$TAG.zip" "agentic-readiness-implement-$TAG.zip" > SHA256SUMS)
          cat "$out/SHA256SUMS"
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"
      # One signed SLSA build provenance statement for the three files in SHA256SUMS, stored in the repository's
      # attestations. The bundle is attached to the release too, so a user can verify without a GitHub login.
      - name: Sign build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.RELEASE_DIR }}/SHA256SUMS
      - name: Add the provenance bundle to the release files
        env:
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RELEASE_DIR/$TAG.sigstore.json"
      # release-please has normally made the release already, with the changelog entry as its notes. Then only the
      # files are attached (--clobber makes a re-run safe). For a hand-started run on a tag with no release, the
      # release is created here.
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_DIR"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RELEASE_DIR"/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag \
              --notes "See CHANGELOG.md. Verify a download with: sha256sum -c SHA256SUMS (provenance: docs/how-to/install-the-skills.md)"
          fi
