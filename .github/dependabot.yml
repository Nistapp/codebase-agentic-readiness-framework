# Dependabot opens security pull requests only, and never for a major version
# (docs/architecture/adrs/0003-dependabot-security-pull-requests-only.md; RELEASE_PROCESS.md, "Dependency updates").
#
# - `open-pull-requests-limit: 0` turns off version updates. Security updates are on in the repository settings and
#   do not use this limit.
# - The `ignore` rule for `version-update:semver-major` also applies to security updates. A fix that needs a major
#   version opens no pull request; its alert stays in the Security tab, and the maintainer upgrades by hand.
# - No `target-branch`: with one, these options stop applying to security updates. Security updates always go to
#   the default branch, `dev`.
# - `cooldown: default-days: 7` applies to version updates only, which are off. It is there so that zizmor
#   (`make workflow-lint`) passes, and so that a version update, if one is ever turned on, waits a week.
# - The template and the engine's test fixtures are data. Their alerts stay visible; Dependabot never edits them.
version: 2
updates:
  # The actions in .github/workflows, pinned by commit SHA with the version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The Python dev tools (ruff, mypy, detect-secrets, coverage, jsonschema, skills-ref, uv, actionlint-py, zizmor,
  # check-jsonschema), locked in uv.lock. The
  # Makefile, lefthook.yml and the workflows read each version from dev/tools/pyproject.toml.
  - package-ecosystem: uv
    directory: /dev/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "build"

  # The Node dev tools (markdownlint-cli2, mermaid-cli), locked in package-lock.json. The Makefile and
  # dev/mermaid_check.py read each version from dev/tools/package.json.
  - package-ecosystem: npm
    directory: /dev/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "build"

  # Data, not dependencies: the greenfield template and the engine's test fixtures. No pull request, ever.
  - package-ecosystem: npm
    directories: ["/greenfield/templates", "/audit/engine/tests/fixtures/**"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: pip
    directories: ["/audit/engine/tests/fixtures/**"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: maven
    directories: ["/audit/engine/tests/fixtures/**"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: gradle
    directories: ["/audit/engine/tests/fixtures/**"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
