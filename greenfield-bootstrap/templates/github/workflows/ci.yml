name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-verify:
    name: Build, Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting & Lint (Biome)
        run: npx biome ci .

      - name: Type-Check (Production)
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Verify Build
        run: npm run build:full

      - name: Security Audit
        run: npm audit --audit-level=high
