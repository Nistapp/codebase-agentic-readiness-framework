name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-verify:
    name: Build, Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: <node-version>
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Every step below is a script name a developer or agent can run locally.
      # Never add a CI-only gate: an unreachable gate cannot be honoured.
      - name: Check (format, lint, typecheck, tests)
        run: npm run check

      # Coverage thresholds are enabled with the first real test (see vitest.config.ts).
      # - name: Verify Coverage Thresholds
      #   run: npm run test:coverage

      - name: Verify Build
        run: npm run build:full

      - name: Security Audit
        run: npm run security
