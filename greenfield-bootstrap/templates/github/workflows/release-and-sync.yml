name: Release & Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # PRs opened with the default GITHUB_TOKEN don't trigger other workflows, so required
  # status checks never report on them. If your branch protection requires checks on the
  # Release PR / back-merge PR, generate a GitHub App installation token here instead and
  # swap `secrets.GITHUB_TOKEN` for `steps.app-token.outputs.token` below. One-time setup:
  # create a GitHub App (Contents: RW, Pull requests: RW, Issues: RW), install it on this
  # repo only, store its ID as repo variable RELEASE_APP_ID and a generated private key as
  # repo secret RELEASE_APP_PRIVATE_KEY.
  #
  # app-token:
  #   name: Generate GitHub App token
  #   runs-on: ubuntu-latest
  #   outputs:
  #     token: ${{ steps.app-token.outputs.token }}
  #   steps:
  #     - id: app-token
  #       uses: actions/create-github-app-token@v2
  #       with:
  #         app-id: ${{ vars.RELEASE_APP_ID }}
  #         private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: main

  back-merge:
    name: Automate Back-Merge
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Back-Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after release" \
            --body "🤖 **Automated PR:** This syncs the updated \`package.json\` and \`CHANGELOG.md\` from \`main\` back to \`dev\` after a release. Please merge this immediately to prevent future merge conflicts."

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Uncomment once the npm Environment described in RELEASE_PROCESS.md is configured,
    # so an approver must sign off before the environment's secrets/OIDC are usable.
    # environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js <node-version>
        uses: actions/setup-node@v4
        with:
          node-version: <node-version>
          registry-url: https://registry.npmjs.org/
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Recommended default: npm Trusted Publishing (GitHub OIDC, no stored token) with
      # staged publishing, so a maintainer approves the version on npmjs.com before it
      # becomes `latest`. Requires npm >= 11.21 and the one-time setup in
      # RELEASE_PROCESS.md -> npm Publishing.
      - name: Publish to npm (staged)
        run: npm stage publish --provenance --access public

      # Fallback for projects that don't want a staged-approval step: publish immediately.
      # - name: Publish to npm
      #   run: npm publish --provenance --access public
